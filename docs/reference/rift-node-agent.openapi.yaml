openapi: 3.1.0
info:
  title: RIFT Node Agent API
  version: 1.2.0
  description: |
    Lightweight desired-state and inventory API served by an enrolled RIFT
    node. TLS 1.2 or newer and mutual certificate authentication are mandatory
    for every implemented `/v1` operation. Node-side policy independently gates
    downloads, installs, and launches even when the controller requests them.

    The controller-side discovery bootstrap listener exposes enrollment-only
    routes for a short operator-controlled window. Controller-side mesh enrollment, certificate issuance,
    capability publication, link reporting, and route resolution are specified
    in `rift-controller.openapi.yaml`.
servers:
  - url: https://rift-node.example:11750
    description: Enrolled node-agent control endpoint
tags:
  - name: Bootstrap
  - name: Health
  - name: Inventory
  - name: Desired state
security:
  - mutualTLS: []
x-rift-controller-publish-contracts:
  capabilities: /api/rift/v2/mesh/nodes/{nodeId}/capabilities
  links: /api/rift/v2/mesh/links
  route_resolve: /api/rift/v2/mesh/routes/resolve

paths:
  /.well-known/rift-node:
    get:
      tags: [Bootstrap]
      operationId: getRiftNodeBootstrapRecord
      summary: Return the untrusted discovery bootstrap record.
      description: |
        Protocol target consumed by HTTPS subnet and USB-network probes. The
        TLS certificate observed by the client is hashed and compared with the
        advertised fingerprint. This path does not enroll or authenticate a
        node. The current Python node-agent handler does not implement this
        route; physical discovery bootstrap acceptance is pending.
      security: []
      x-rift-implementation-status: PHYSICAL_ACCEPTANCE_PENDING
      responses:
        "200":
          description: Untrusted bootstrap record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapRecord"
        "404":
          description: Current Python node agent has not enabled the bootstrap responder.

  /.well-known/rift-controller:
    get:
      tags: [Bootstrap]
      operationId: getRiftControllerBootstrapRecord
      summary: Discover an enrollment-enabled controller.
      description: The controller returns only its public identifier, bootstrap certificate fingerprint, and enrollment endpoint.
      security: []
      servers:
        - url: https://rift-controller.example:11748
      responses:
        "200":
          description: Controller bootstrap metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerBootstrapRecord"

  /v1/bootstrap/enrollments:
    post:
      tags: [Bootstrap]
      operationId: beginManagedNodeEnrollment
      summary: Submit a node CSR and ephemeral pairing key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapEnrollmentRequest"
      responses:
        "201":
          description: Pairing challenge created. The six-digit code remains on the node.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapEnrollmentChallenge"

  /v1/bootstrap/enrollments/{enrollmentId}:
    get:
      tags: [Bootstrap]
      operationId: getManagedNodeEnrollment
      summary: Poll certificate issuance state.
      security: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Safe enrollment state and, after approval, an encrypted certificate envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapEnrollmentStatus"

  /v1/bootstrap/enrollments/{enrollmentId}/activate:
    post:
      tags: [Bootstrap]
      operationId: activateManagedNodeEnrollment
      summary: Verify a node over mTLS and activate it.
      security: []
      parameters:
        - name: enrollmentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Node passed authenticated health verification and is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapActivation"

  /v1/health:
    get:
      tags: [Health]
      operationId: getNodeHealth
      summary: Get node-agent health and desired-state generations.
      responses:
        "200":
          description: Healthy node agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeHealth"
        "401":
          description: A valid controller client certificate was not presented.

  /v1/discovery:
    get:
      tags: [Inventory]
      operationId: getNodeDiscovery
      summary: Get measured hardware, backend, artifact, and agent inventory.
      responses:
        "200":
          description: Live node inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDiscovery"
        "401":
          description: A valid controller client certificate was not presented.

  /v1/artifacts:
    get:
      tags: [Inventory]
      operationId: getNodeArtifacts
      summary: Get local model artifact inventory.
      responses:
        "200":
          description: Artifact inventory rooted under `.rift/models`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactInventory"
        "401":
          description: A valid controller client certificate was not presented.

  /v1/state:
    get:
      tags: [Desired state]
      operationId: getNodeState
      summary: Get desired and observed node state.
      responses:
        "200":
          description: Agent, desired-state, and runtime state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeState"
        "401":
          description: A valid controller client certificate was not presented.

  /v1/desired-state:
    post:
      tags: [Desired state]
      operationId: submitNodeDesiredState
      summary: Submit a monotonically increasing desired-state generation.
      description: |
        Repeating the same generation with identical content is idempotent.
        Reusing a generation with different content or submitting an older
        generation is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredStateRequest"
      responses:
        "200":
          description: Accepted or idempotently retained generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredStateAcceptance"
        "400":
          description: Stale generation, generation collision, or invalid config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "401":
          description: A valid controller client certificate was not presented.

  /v1/reconcile:
    post:
      tags: [Desired state]
      operationId: reconcileNodeDesiredState
      summary: Plan or apply accepted desired state under node-side permissions.
      description: |
        A request permission is effective only when both the request and the
        node's local policy allow it. Omitting `apply` produces a plan without
        applying side effects.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileRequest"
      responses:
        "200":
          description: Reconciliation plan or apply result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileResult"
        "400":
          description: Invalid request or desired state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentError"
        "401":
          description: A valid controller client certificate was not presented.

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: Controller and node certificates chained to the configured client CA.

  schemas:
    OpenObject:
      type: object
      additionalProperties: true

    AgentError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    BootstrapRecord:
      type: object
      required:
        - endpoint
        - node_hint
        - api_version
        - bootstrap_fingerprint
      properties:
        endpoint:
          type: string
          format: uri
          pattern: "^https://"
        node_hint:
          type: string
        api_version:
          type: string
          default: "2"
        bootstrap_fingerprint:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        ttl_seconds:
          type: number
          exclusiveMinimum: 0
          default: 120
        interface_id:
          type: string
        metadata:
          $ref: "#/components/schemas/OpenObject"

    ControllerBootstrapRecord:
      type: object
      required: [controller_id, endpoint, api_version, bootstrap_fingerprint]
      properties:
        controller_id: { type: string }
        endpoint: { type: string, format: uri, pattern: "^https://" }
        api_version: { type: string, const: "2" }
        bootstrap_fingerprint: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        ttl_seconds: { type: integer, minimum: 1 }

    BootstrapEnrollmentRequest:
      type: object
      required: [node_id, display_name, endpoint, csr_pem, node_public_key]
      properties:
        node_id: { type: string }
        display_name: { type: string }
        endpoint: { type: string, format: uri, pattern: "^https://" }
        csr_pem: { type: string, writeOnly: true }
        node_public_key: { type: string, pattern: "^[0-9a-fA-F]{64}$", writeOnly: true }

    BootstrapEnrollmentChallenge:
      type: object
      required: [enrollment_id, node_id, controller_public_key, transcript, state]
      properties:
        enrollment_id: { type: string }
        node_id: { type: string }
        controller_public_key: { type: string, writeOnly: true }
        transcript: { type: string, writeOnly: true }
        state: { type: string, enum: [PAIRING_PENDING] }
        expires_at: { type: number }

    BootstrapEnrollmentStatus:
      type: object
      required: [enrollment_id, state]
      properties:
        enrollment_id: { type: string }
        node_id: { type: string }
        state:
          type: string
          enum: [PAIRING_PENDING, ENROLLED, CERTIFICATE_ISSUED, ACTIVE, EXPIRED, REJECTED, CANCELLED]
        certificate_envelope:
          type: object
          writeOnly: true
          additionalProperties: true

    BootstrapActivation:
      type: object
      required: [state, node_id, activation_envelope]
      properties:
        state: { type: string, const: ACTIVE }
        node_id: { type: string }
        activation_envelope:
          type: object
          writeOnly: true
          additionalProperties: true

    NodeHealth:
      type: object
      required:
        - ok
        - node_id
        - mutual_tls_required
        - desired_generation
        - last_reconciled_generation
        - created_unix_seconds
      properties:
        ok:
          type: boolean
          const: true
        node_id:
          type: string
        mutual_tls_required:
          type: boolean
          const: true
        desired_generation:
          type: integer
          minimum: 0
        last_reconciled_generation:
          type: integer
          minimum: 0
        created_unix_seconds:
          type: number

    ArtifactInventory:
      type: object
      required: [model_root, artifacts]
      properties:
        model_root:
          type: string
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/OpenObject"

    NodeDiscovery:
      type: object
      required: [node_id, hardware, backends, artifact_inventory, agent]
      properties:
        node_id:
          type: string
        hardware:
          $ref: "#/components/schemas/OpenObject"
        backends:
          $ref: "#/components/schemas/OpenObject"
        artifact_inventory:
          $ref: "#/components/schemas/ArtifactInventory"
        agent:
          $ref: "#/components/schemas/NodeHealth"

    DesiredStateRequest:
      type: object
      required: [generation, config]
      properties:
        generation:
          type: integer
          minimum: 1
        config:
          $ref: "#/components/schemas/OpenObject"

    DesiredStateAcceptance:
      type: object
      required: [accepted, changed, generation, config_fingerprint]
      properties:
        accepted:
          type: boolean
          const: true
        changed:
          type: boolean
        generation:
          type: integer
          minimum: 1
        config_fingerprint:
          type: string
          pattern: "^[0-9a-f]{64}$"

    ReconcileRequest:
      type: object
      properties:
        apply:
          type: boolean
          default: false
        permissions:
          type: object
          properties:
            allow_download:
              type: boolean
              default: false
            allow_install:
              type: boolean
              default: false
            allow_launch:
              type: boolean
              default: false

    ReconcileResult:
      type: object
      required: [reconciled, generation]
      properties:
        reconciled:
          type: boolean
        generation:
          type: integer
          minimum: 1
        applied:
          type: boolean
        reason:
          type: string
        plan:
          $ref: "#/components/schemas/OpenObject"
      additionalProperties: true

    NodeState:
      type: object
      required: [agent, desired_state, runtime]
      properties:
        agent:
          $ref: "#/components/schemas/NodeHealth"
        desired_state:
          $ref: "#/components/schemas/OpenObject"
        runtime:
          $ref: "#/components/schemas/OpenObject"

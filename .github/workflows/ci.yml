name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Python ${{ matrix.python-version }} control plane
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install .
      - name: Run deterministic Python suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/python/*_tests.py; do
            python "$test_file"
          done
      - name: Release audit
        run: python scripts/verify_release.py

  package:
    name: Wheel and clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --no-isolation
      - name: Install produced wheel in a clean environment
        run: |
          python -m venv /tmp/rift-clean-venv
          /tmp/rift-clean-venv/bin/python -m pip install dist/*.whl
          /tmp/rift-clean-venv/bin/rift --version
          /tmp/rift-clean-venv/bin/rift --help

  dashboard-source:
    name: Dashboard source checks
    runs-on: ubuntu-latest
    if: ${{ hashFiles('ui/package.json') != '' }}
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  containers:
    name: Container manifest checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/python/container_manifest_tests.py

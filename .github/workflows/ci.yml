name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    name: Python control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install control-plane dependencies
        run: python -m pip install PyYAML zeroconf cryptography
      - name: Release provenance audit
        run: python scripts/audit_release.py --root . --json
      - name: Run deterministic Python suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/python/*_tests.py; do
            python "$test_file"
          done

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seismic-deploy-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seismic-deploy-main/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  android:
    name: Android client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Android unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug

# Native C++/CUDA acceptance runs on real CUDA hardware through CMakePresets.
# A public self-hosted runner matrix will be added before the stable release.
